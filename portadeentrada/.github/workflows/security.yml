name: Security Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '23 6 * * 1' # Monday 06:23 UTC (off-peak)

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947e795f258d1e45b00 # v0.30.0
        with:
          scan-type: 'fs'
          scan-ref: 'portadeentrada'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0' # Don't fail on findings — report only

      - name: Run Trivy config scan (hardcoded secrets)
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947e795f258d1e45b00 # v0.30.0
        with:
          scan-type: 'config'
          scan-ref: 'portadeentrada'
          format: 'sarif'
          output: 'trivy-config-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy SARIF reports
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-fs-results.sarif'

      - name: Fail on CRITICAL findings
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947e795f258d1e45b00 # v0.30.0
        with:
          scan-type: 'fs'
          scan-ref: 'portadeentrada'
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '1'

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: trivy
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Generate SBOM with Trivy
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947e795f258d1e45b00 # v0.30.0
        with:
          scan-type: 'fs'
          scan-ref: 'portadeentrada'
          format: 'cyclonedx'
          output: 'sbom.json'

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom.json
          retention-days: 30

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
